{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> zoanig | {{request.resolver_match.url_name}}</title>
    <link rel="stylesheet" href={% static "style.css" %}>
    <link rel="icon" href={% static "favicon.svg" %} type="image/svg+xml">
</head>
<body>
    <nav>
        {% with "$ about projects contact" as edps %}
            {% for endp in edps.split %}
                {% if endp == '$' %}
                    <a href="#">home</a>
                {% else %}
                    <a href="#">{{ endp }}</a>
                {% endif %}
            {% endfor %}
        {% endwith %}

    </nav>
    {% block content %}{% endblock %}
    <script src={% static "app.js" %}></script>
</body>
</html>
